name: Full verification

# The slow end of verification, off the per-push path: every test under the
# strict ASan+UBSan build (Debug, -Og, assertions on), under ThreadSanitizer,
# and with Clang (Debug),
# including the slow ones ci.yml runs on a PR in Release only; and
# clang-tidy on every file. Nightly on main, and on demand from the Actions
# tab. A failed scheduled run opens (or comments on) a GitHub issue.

on:
  schedule:
    - cron: "23 7 * * *"  # daily, 07:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One job for now. When the strict build's suite outgrows it, split it with
  # a matrix part and `ctest -I <part>,,<n>` (every n-th test); each part must
  # still select at least one test, as the presets fail on none.
  asan:
    name: Ubuntu GCC ASan+UBSan (strict), all tests
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CC: gcc
      CXX: g++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      # GPU tests run on lavapipe with validation; a missing driver or
      # layer fails them instead of skipping.
      FOVEA_REQUIRE_VULKAN: "1"
      FOVEA_REQUIRE_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja, ccache, SDL's X11 dependencies and lavapipe
        timeout-minutes: 10
        run: tools/ci/apt-install.sh ninja-build ccache libx11-dev libxext-dev libxrandr-dev mesa-vulkan-drivers libvulkan1 vulkan-validationlayers
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ubuntu-gcc-asan-${{ github.sha }}
          restore-keys: ccache-ubuntu-gcc-asan-
      - name: Configure
        run: >-
          cmake --preset asan
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset asan
      - name: Test (all, slow ones included)
        run: ctest --preset asan --parallel "$(nproc)"

  tsan:
    name: Ubuntu GCC ThreadSanitizer, all tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: gcc
      CXX: g++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      # GPU tests run on lavapipe, without the validation layer: it is not
      # built with TSan, which then reports races between its own threads.
      # (Every other job runs with it.)
      FOVEA_REQUIRE_VULKAN: "1"
      VK_LOADER_LAYERS_DISABLE: VK_LAYER_KHRONOS_validation
      # lavapipe isn't TSan-built either: tools/ci/tsan.supp says what's hidden.
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/ci/tsan.supp
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja, ccache, SDL's X11 dependencies and lavapipe
        timeout-minutes: 10
        run: tools/ci/apt-install.sh ninja-build ccache libx11-dev libxext-dev libxrandr-dev mesa-vulkan-drivers libvulkan1 vulkan-validationlayers
      # Ubuntu 24.04's default mmap randomization (32 bits) puts mappings
      # where TSan's shadow memory goes ("unexpected memory mapping").
      - name: Reduce address-space randomization for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ubuntu-gcc-tsan-${{ github.sha }}
          restore-keys: ccache-ubuntu-gcc-tsan-
      - name: Configure
        run: >-
          cmake --preset tsan
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset tsan
      - name: Test
        run: ctest --preset tsan --parallel "$(nproc)"

  clang:
    name: Ubuntu Clang Debug, all tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      # GPU tests run on lavapipe with validation; a missing driver or
      # layer fails them instead of skipping.
      FOVEA_REQUIRE_VULKAN: "1"
      FOVEA_REQUIRE_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja, ccache, SDL's X11 dependencies and lavapipe
        timeout-minutes: 10
        run: tools/ci/apt-install.sh ninja-build ccache libx11-dev libxext-dev libxrandr-dev mesa-vulkan-drivers libvulkan1 vulkan-validationlayers
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ubuntu-clang-debug-${{ github.sha }}
          restore-keys: ccache-ubuntu-clang-debug-
      - name: Configure
        run: >-
          cmake --preset debug
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset debug
      - name: Test (all, slow ones included)
        run: ctest --preset debug --parallel "$(nproc)"

  fuzz:
    name: Fuzz the CIGI codec (libFuzzer, 5 minutes)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja and SDL's X11 dependencies (needed to configure)
        timeout-minutes: 10
        run: tools/ci/apt-install.sh ninja-build libx11-dev libxext-dev libxrandr-dev
      - name: Configure
        run: cmake --preset fuzz
      - name: Build
        run: cmake --build --preset fuzz --target fovea_fuzz_cigi
      # Any crash, sanitizer report or failed round trip fails the job and
      # leaves the input in fuzz-artifacts/.
      # The corpus grows night to night instead of restarting from the seeds.
      - name: Restore the fuzz corpus
        uses: actions/cache@v4
        with:
          path: fuzz-corpus
          key: fuzz-corpus-cigi-${{ github.run_id }}
          restore-keys: fuzz-corpus-cigi-
      - name: Fuzz
        run: |
          mkdir -p fuzz-corpus fuzz-artifacts
          ./build/fuzz/tests/fovea_fuzz_cigi -max_total_time=300 -artifact_prefix=fuzz-artifacts/ fuzz-corpus tests/fuzz/corpus/cigi
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts/

  tidy:
    name: clang-tidy, every file
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        timeout-minutes: 10
        run: tools/ci/apt-install.sh ninja-build clang-tidy-18 libx11-dev libxext-dev libxrandr-dev
      - name: Configure (for compile_commands.json)
        run: cmake --preset debug
      # Shader headers are generated at build time; tidy needs them.
      - name: Generate the shader headers
        run: cmake --build --preset debug --target fovea_shaders
      - name: clang-tidy
        run: |
          files=$(git ls-files 'apps/*.cpp' 'libs/*.cpp' 'tools/*.cpp')
          if [ -z "$files" ]; then echo "no C++ files to check"; exit 0; fi
          out=$(clang-tidy-18 -p build/debug --quiet $files 2>&1 | grep -E "warning:|error:" || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

  # A failed scheduled run opens an issue, or comments on the open one, so
  # it can't go unnoticed. A job past its time limit ends cancelled, not
  # failed, and failure() misses it, so the needed jobs' results are read
  # instead.
  report:
    name: Report a failed nightly run
    needs: [asan, tsan, clang, tidy, fuzz]
    if: >-
      always() && github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly full verification is failing"
          body="Run: $RUN_URL ($(date -u +%Y-%m-%d))"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Failed again. $body"
          else
            gh issue create --title "$title" --label ci --body "$body"
          fi
