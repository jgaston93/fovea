# A dawn approach to KHSV runway 36L through ground fog (milestone 6 step 7):
# the host sets the environment over CIGI. The approach of khsv-approach.toml,
# starting at 11:45 UTC on 20 March 2026 (about ten minutes before sunrise,
# 06:55 local daylight time) with the clock running, 15 km visibility, and
# fog from below the field to about 35 m over the runway, 400 m visibility
# within it. Over the threshold the fog lifts (Weather Enable off), and the
# climb away is in clearer air. Clouds aren't drawn yet (issue #73). Run
# Fovea with config/khsv.toml, then:
#   cigi-test-host tools/cigi-test-host/scripts/khsv-dawn.toml

[ig]
address = "127.0.0.1"
port = 8004

[host]
port = 8005
rate_hz = 60.0

[start]
lat = 34.564088
lon = -86.783860
alt = 515.7      # 15 m over the threshold plus 6 km at 3 degrees
heading = 0.9
speed = 70.0

[flight]
loop = false

[[segment]]
kind = "straight"
duration = 85.7  # 6 km at 70 m/s
speed = 70.0
climb = -3.67    # 3 degrees at 70 m/s
date = 2026-03-20
time = 11:45:00  # UTC
time_runs = true
visibility = 15000.0

[[segment.layer]]
id = 0           # ground fog
base = 100.0     # m above sea level: below the field (186 m)
thickness = 120.0
visibility = 400.0

[[segment]]
kind = "straight"
duration = 55.0  # the length of the runway
speed = 70.0

[[segment.layer]]
id = 0
enable = false   # the fog lifts

[[segment]]
kind = "straight"
duration = 40.0  # climbing away at about 5 degrees
speed = 70.0
climb = 6.0
visibility = 30000.0
