# Round KHSV's buildings (milestone 4 step 4): about 70 m over the
# airfield at 50 m/s, north up the middle of the field past the control
# tower, a right turn all the way round over the hangars and the terminal's
# ramp, north over the terminal, and a turn back south; level at the end;
# once (about 3 minutes). For judging the landmarks. Run Fovea with
# config/khsv.toml, then:
#   cigi-test-host tools/cigi-test-host/scripts/khsv-airport.toml

[ig]
address = "127.0.0.1"
port = 8004

[host]
port = 8005
rate_hz = 60.0

[start]
lat = 34.625
lon = -86.7745
alt = 260.0      # about 70 m over the field (628.9 ft)
heading = 0.0
speed = 50.0

[flight]
loop = false

[[segment]]
kind = "straight"   # north, 2 km, passing 55 m west of the tower
duration = 40.0
speed = 50.0

[[segment]]
kind = "turn"       # right, all the way round (480 m across): the hangars and the ramp
duration = 60.0
speed = 50.0
turn_rate = 6.0

[[segment]]
kind = "straight"   # north over the terminal
duration = 25.0
speed = 50.0

[[segment]]
kind = "turn"       # left, back to the south
duration = 30.0
speed = 50.0
turn_rate = -6.0

[[segment]]
kind = "straight"   # south past the cargo buildings' side of the field; level
duration = 40.0
speed = 50.0
