# A low pass over KHSV (milestone 3 step 7): about 110 m over the airfield
# at 60 m/s, north along the airfield past the runways' north end, a turn
# back, south just west of runway 36L/18R, a second turn, and level again;
# once (about 4 minutes). For judging the terrain up close
# and any popping between levels. Run Fovea with config/khsv.toml, then:
#   cigi-test-host tools/cigi-test-host/scripts/khsv-low.toml

[ig]
address = "127.0.0.1"
port = 8004

[host]
port = 8005
rate_hz = 60.0

[start]
lat = 34.580
lon = -86.775
alt = 300.0      # about 110 m over the airfield (628.9 ft)
heading = 0.0
speed = 60.0

[flight]
loop = false

[[segment]]
kind = "straight"   # north over the airfield, 5.4 km, past its north end
duration = 90.0
speed = 60.0

[[segment]]
kind = "turn"       # left, back to the south
duration = 30.0
speed = 60.0
turn_rate = -6.0

[[segment]]
kind = "straight"   # south, about 330 m west of runway 36L/18R
duration = 90.0
speed = 60.0

[[segment]]
kind = "turn"       # left again
duration = 30.0
speed = 60.0
turn_rate = -6.0

[[segment]]
kind = "straight"   # level: the eye holds its last pose once the flight ends
duration = 15.0
speed = 60.0
