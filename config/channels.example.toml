# Example display configuration: three side-by-side screens around one
# viewpoint (docs/architecture.md, "Channel config schema").
#
# Each channel's viewpoint rides on a scene entity (`entity`, default 0: the
# host's main entity, such as CIGI's ownship), offset and rotated in that
# entity's body axes: x forward, y right, z down. Angles are in degrees;
# offsets in metres. The frustum values are placeholders until the physical
# screen geometry and eye point are measured.

[display]
presenter = "multi_swapchain"   # or "spanned", "offscreen"
target_hz = 60
near_m = 0.1                    # reverse-Z, infinite far plane
msaa = 4                        # samples per pixel: 1, 2, 4 or 8 (D-027), as the GPU can

# The date, time and weather (milestone 6, D-029; all optional), until a
# host sets them. The sun and moon follow the date and time.
[environment]
date = 2026-03-20               # UTC
time = 15:30:00                 # UTC; 10:30 at Huntsville in March (CDT)
time_runs = true                # false: the time stays as set
visibility_m = 50000            # drawn from milestone 6 step 3

# Weather layers (milestone 6 step 6), up to six: heights above mean sea
# level, made ellipsoidal with [host]'s geoid_height_m. Fog, rain and snow
# are bands of the visibility given (fog's 200 m, rain's 5,000 and snow's
# 1,500 if not). Cloud layers are taken (coverage: the share of the sky,
# 1 overcast) but not drawn yet (issue #73). One fog, rain and snow layer
# each, up to three cloud layers. A host's packets replace all of this as
# they arrive (step 7): its time, its visibility, and each layer it sends.
# [[environment.layer]]
# kind = "cloud"                # cloud, fog, rain or snow
# base_m = 1500
# thickness_m = 400
# coverage = 0.5                # clouds only
# [[environment.layer]]
# kind = "fog"
# base_m = 150
# thickness_m = 120
# visibility_m = 300            # fog, rain and snow only

# The milestone 1 reference scene (all optional).
[reference_scene]
eye_height_m = 2.0              # the eye above the ground grid
grid_spacing_m = 10.0
exposure_ev = 0.0
# The ground grid is the level plane through this point, and a host's
# entities fly over it (milestone 2): degrees, and metres above sea level;
# 0, 0, 0 if left out. Set it to where the host flies, e.g. an airport's
# reference point.
# origin = { lat = 34.6, lon = -86.8, alt = 190.0 }

[[channel]]
name = "left"
monitor = 0                     # platform monitor index
entity = 0                      # scene entity the viewpoint rides on
present_mode = "fifo"           # or "mailbox", "immediate"
render_extent = [1920, 1080]
eye_offset = { x = 0.0, y = 0.0, z = 0.0 }
view_rotation = { yaw = -60.0, pitch = 0.0, roll = 0.0 }
frustum = { left = -30.0, right = 30.0, top = 17.0, bottom = -17.0 }

[[channel]]
name = "center"
monitor = 1
present_mode = "fifo"
render_extent = [1920, 1080]
eye_offset = { x = 0.0, y = 0.0, z = 0.0 }
view_rotation = { yaw = 0.0, pitch = 0.0, roll = 0.0 }
frustum = { left = -30.0, right = 30.0, top = 17.0, bottom = -17.0 }

[[channel]]
name = "right"
monitor = 2
present_mode = "fifo"
render_extent = [1920, 1080]
eye_offset = { x = 0.0, y = 0.0, z = 0.0 }
view_rotation = { yaw = 60.0, pitch = 0.0, roll = 0.0 }
frustum = { left = -30.0, right = 30.0, top = 17.0, bottom = -17.0 }

# A host program driving the scene (milestone 2): CIGI 3.3 over UDP. Leave
# it out and nothing listens. The ports default to the usual CIGI pair
# (the ICD names none); the host's settings must match.
# [host]
# protocol = "cigi"
# port = 8004                  # where the host's messages arrive (8004 if left out)
# host_address = "127.0.0.1"   # where Start of Frame goes (left out: wherever the host sends from)
# host_port = 8005             #   and at which port (8005 if left out; 0: the one it sends from)
# byte_order = "network"       # what the IG sends: "network" (big-endian, if left out) or "native"
# geoid_height_m = 0.0         # the geoid above the WGS-84 ellipsoid, here
