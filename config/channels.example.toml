# Example display configuration: three side-by-side screens around one
# viewpoint (docs/architecture.md, "Channel config schema").
#
# Each channel's viewpoint rides on a scene entity (`entity`, default 0: the
# host's main entity, such as CIGI's ownship), offset and rotated in that
# entity's body axes: x forward, y right, z down. Angles are in degrees;
# offsets in metres. The frustum values are placeholders until the physical
# screen geometry and eye point are measured.

[display]
presenter = "multi_swapchain"   # or "spanned", "offscreen"
target_hz = 60
near_m = 0.1                    # reverse-Z, infinite far plane

# The milestone 1 reference scene (all optional).
[reference_scene]
eye_height_m = 2.0              # the eye above the ground grid
grid_spacing_m = 10.0
exposure_ev = 0.0
# The ground grid is the level plane through this point, and a host's
# entities fly over it (milestone 2): degrees, and metres above sea level;
# 0, 0, 0 if left out. Set it to where the host flies, e.g. an airport's
# reference point.
# origin = { lat = 34.6, lon = -86.8, alt = 190.0 }

[[channel]]
name = "left"
monitor = 0                     # platform monitor index
entity = 0                      # scene entity the viewpoint rides on
present_mode = "fifo"           # or "mailbox", "immediate"
render_extent = [1920, 1080]
eye_offset = { x = 0.0, y = 0.0, z = 0.0 }
view_rotation = { yaw = -60.0, pitch = 0.0, roll = 0.0 }
frustum = { left = -30.0, right = 30.0, top = 17.0, bottom = -17.0 }

[[channel]]
name = "center"
monitor = 1
present_mode = "fifo"
render_extent = [1920, 1080]
eye_offset = { x = 0.0, y = 0.0, z = 0.0 }
view_rotation = { yaw = 0.0, pitch = 0.0, roll = 0.0 }
frustum = { left = -30.0, right = 30.0, top = 17.0, bottom = -17.0 }

[[channel]]
name = "right"
monitor = 2
present_mode = "fifo"
render_extent = [1920, 1080]
eye_offset = { x = 0.0, y = 0.0, z = 0.0 }
view_rotation = { yaw = 60.0, pitch = 0.0, roll = 0.0 }
frustum = { left = -30.0, right = 30.0, top = 17.0, bottom = -17.0 }

# A host program driving the scene (milestone 2): CIGI 3.3 over UDP. Leave
# it out and nothing listens. The ports are any free ones; the host's
# settings must match (the CIGI ICD names none).
# [host]
# protocol = "cigi"
# port = 8004                  # where the host's messages arrive
# host_address = "127.0.0.1"   # where Start of Frame goes; set both, or neither
# host_port = 8005             #   (neither: back to wherever the host sends from)
# geoid_height_m = 0.0         # the geoid above the WGS-84 ellipsoid, here
