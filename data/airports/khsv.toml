# Huntsville International (KHSV): its runways, from the FAA's airport data
# as AirNav publishes it (www.airnav.com/airport/KHSV, checked 2026-11-07).
# Ends are the pavement's ends, as published (degrees-minutes, NAD83);
# elevations are surveyed, in feet, NAVD88. US Government work, public
# domain. The compiler smooths the elevation on each runway (D-022), and
# tools/check-elevation.py checks the database against these.
#
# The lights (milestone 6 step 8, D-033) are the FAA's NASR airport data,
# cycle nasr_cycle, as coded there: edge_lights is RWY_LGT_CODE; per end,
# markings is RWY_MARKING_TYPE_CODE (PIR: precision instrument, which
# gives the edge lights their yellow caution zone), approach_lights
# APCH_LGT_SYSTEM_CODE, vgsi VGSI_CODE (P4R: a 4-box PAPI on the right),
# and the flags CNTRLN_LGTS_AVBL_FLAG,
# TDZ_LGT_AVBL_FLAG and RWY_END_LGTS_FLAG (REIL). The instrument approach
# plates agree: ALSF-2 on 18R, MALSR on the others, HIRL on both runways,
# TDZL and RCLS on 18R and 36L. tools/check-airports.py checks these files
# against a NASR cycle.

name = "KHSV"
nasr_cycle = "2026-10-29"
field_elevation_ft = 628.9  # the highest point of the runways

[[runway]]
name = "18R/36L"
width_ft = 150.0
length_ft = 12600.0
edge_lights = "HIGH"

[[runway.end]]
id = "18R"
lat = "34-39.167130N"
lon = "086-46.926028W"
elevation_ft = 628.4
markings = "PIR"
approach_lights = "ALSF2"
centreline_lights = true
