# The KHUA (Redstone Army Airfield) landmarks (milestone 4 step 6, D-026):
# each a model in data/models (built by airport_landmarks.py) at a point and
# true heading (degrees clockwise from north; the model's front, its depth,
# along it). Points are the footprints' centres, read off the NAIP 2023
# imagery (to a few metres); the buildings stand square to the runway
